plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.patropatri.app"
        minSdkVersion 19
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    //===============================================| Design
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'de.hdodenhof:circleimageview:3.0.1'
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'
    //===============================================| Permissions
    implementation 'pub.devrel:easypermissions:3.0.0'
    //===============================================| Picasso load image library
    implementation 'com.squareup.picasso:picasso:2.71828'
    //===============================================| Google Maps
    //implementation 'com.google.android.gms:play-services-location:17.1.0'
    //implementation 'com.google.android.gms:play-services-maps:17.0.0'
    //implementation 'com.google.maps.android:android-maps-utils:0.5'
    //===============================================| Retrofit2
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    //===============================================| Android Jetpack Components for MVVM
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    //===============================================| Jetpack Component : Room persistence library
    implementation "androidx.room:room-runtime:2.3.0"
    //===============================================| Android Jetpack Components for MVVM
    api "com.github.NaikSoftware:StompProtocolAndroid:1.6.4"
    api "io.reactivex.rxjava2:rxjava:2.2.5"
    //===============================================| International phone number
    //implementation 'com.googlecode.libphonenumber:libphonenumber:8.12.29'
    //===============================================| Lombok : Getter/Setter
    compileOnly 'org.projectlombok:lombok:1.18.20'
    annotationProcessor 'org.projectlombok:lombok:1.18.20'
}